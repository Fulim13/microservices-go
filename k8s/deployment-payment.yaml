apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    service: payment
spec:
  replicas: 3
  selector:
    matchLabels:
      service: payment
  template:
    metadata:
      labels:
        service: payment
    spec:
      containers:
        - name: payment
          image: payment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 3001
          env:
            - name: ENV
              value: "development"
            - name: APPLICATION_PORT
              value: "3001"
            - name: DATA_SOURCE_URL
              value: "postgres://postgres:verysecretpass@postgres:5432/payment?sslmode=disable"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: 'jaeger.observability.svc.cluster.local:4318'
